events {
    worker_connections 1024;
}

http {
    upstream bizora_app_cluster {
        least_conn;
        server web_1:3000 max_fails=3 fail_timeout=10s;
        server web_2:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for load balancer
        location /healthz {
            return 200 '{"status":"healthy","load_balancer":"nginx"}\n';
            add_header Content-Type application/json;
        }

        # Route traffic to application cluster
        location / {
            proxy_pass http://bizora_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
